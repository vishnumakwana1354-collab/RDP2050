name: RDP + MT5 Exness Multi-EA Auto-Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install Exness MT5 from Repository
        run: |
          $installerPath = "$env:GITHUB_WORKSPACE\.github\workflows\exness5setup.exe"
          if (Test-Path $installerPath) {
              Write-Host "Installing Exness MT5 silently from workflows folder..."
              Start-Process -FilePath $installerPath -ArgumentList "/auto", "/silent" -Wait
          } else {
              Write-Error "Setup file 'exness5setup.exe' not found!"
              exit 1
          }

      - name: Sync All EA Files & Launch MT5
        run: |
          $configDir = "C:\MT5Config"
          if (-not (Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir | Out-Null }
          
          # ૧. MT5 ની ડિફૉલ્ટ ડાયરેક્ટરી શરૂ કરવી
          $mt5Exe = "C:\Program Files\MetaTrader 5 - EXNESS\terminal64.exe"
          Start-Process -FilePath $mt5Exe -Wait -WindowStyle Hidden
          Start-Sleep -Seconds 5
          taskkill /F /IM terminal64.exe 2>nul
          Start-Sleep -Seconds 2

          # ૨. MQL5/Experts માં રહેલા તમામ EAs ને MT5 માં ઓટો-કોપી કરવા
          $roamingPath = "$env:APPDATA\MetaQuotes\Terminal"
          if (Test-Path $roamingPath) {
              $terminalFolders = Get-ChildItem -Path $roamingPath -Directory
              foreach ($folder in $terminalFolders) {
                  $expertsPath = Join-Path $folder.FullName "MQL5\Experts"
                  if (Test-Path "$env:GITHUB_WORKSPACE\MQL5\Experts") {
                      if (-not (Test-Path $expertsPath)) { New-Item -ItemType Directory -Path $expertsPath -Force | Out-Null }
                      Write-Host "Copying all EA files to MT5 Experts folder..."
                      Copy-Item -Path "$env:GITHUB_WORKSPACE\MQL5\Experts\*" -Destination $expertsPath -Recurse -Force
                  }
              }
          }

          # ૩. ઓટો-ટ્રેડિંગ કન્ફિગર ફાઈલ સેટ કરવી
          $batPath = "$configDir\run_live_trading.bat"
          
          $batContent = @"
          @echo off
          title MetaTrader 5 Live Auto-Trading - Exness

          :: 1. ચાલુ રહેલા MT5 ને બંધ કરવું
          taskkill /F /IM terminal64.exe 2>nul
          timeout /t 3 /nobreak >nul

          set "MT5_PATH=C:\Program Files\MetaTrader 5 - EXNESS\terminal64.exe"
          set "CONFIG_FILE=%~dp0mt5_live_config.ini"

          :: 2. INI કન્ફિગરેશન ફાઈલ બનાવવી
          (
          echo [Common]
          echo Login=434157116
          echo Password=Admin^&@12345
          echo Server=Exness-MT5Trial7
          echo.
          echo [Community]
          echo Login=rinkugohil30897
          echo Password=fW4JT5vz
          echo.
          echo [Experts]
          echo AllowLiveTrading=1
          echo AllowDllImport=1
          echo WebRequest=1
          echo WebRequestUrl=https://nfs.faireconomy.media/ff_calendar_thisweek.csv,https://api.fxblue.com/market-data/tools/sentiment
          echo.
          echo [Startup]
          echo Symbol=XAUUSD
          echo Period=H1
          ) > "%CONFIG_FILE%"

          :: 3. MT5 ને રન કરવું
          echo Launching Exness MT5...
          start "" "%MT5_PATH%" "/config:%CONFIG_FILE%"
          exit
          "@
          
          $batContent | Out-File -FilePath $batPath -Encoding ascii
          
          Write-Host "Executing Live Auto-Trading Batch file..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$batPath`"" -Wait

      - name: Maintain Connection
        run: |
          Write-Host "`n====================================="
          Write-Host "         RDP ACCESS DETAILS          "
          Write-Host "====================================="
          Write-Host "IP Address : $env:TAILSCALE_IP"
          Write-Host "Username   : RDP"
          Write-Host "Password   : $env:RDP_PASS"
          Write-Host "=====================================`n"
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Server is running..."
            Start-Sleep -Seconds 300
          }
