name: RDP + MT5 & MetaTester Setup Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Credentials
        run: |
          $username = "Admin"
          $password = "Vishnu"

          # Windows Server password complexity override
          secedit /export /cfg "$env:TEMP\secpol.inf"
          (Get-Content "$env:TEMP\secpol.inf") -replace "PasswordComplexity = 1", "PasswordComplexity = 0" | Set-Content "$env:TEMP\secpol.inf"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.inf" /areas SECURITYPOLICY

          net user $username /delete 2>$null
          net user $username $password /add /expires:never /passwordreq:no
          net localgroup Administrators $username /add
          net localgroup "Remote Desktop Users" $username /add

          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Fix Mouse Button Settings (Primary Left Click)
        run: |
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "SwapMouseButtons" -Value "0"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public class MouseSettings {
              [DllImport("user32.dll")]
              public static extern bool SwapMouseButton(bool bSwap);
          }
          '@
          [MouseSettings]::SwapMouseButton($false)
          Write-Host "Mouse primary button successfully set to Left click."

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "$installerPath", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install Setup 1 (Exness MT5) & Setup 2 (mt5tester.setup.exe) Safely
        run: |
          # 1. Install Exness MT5 (Setup 1) with Timeout Protection
          $exnessInstaller = "$env:GITHUB_WORKSPACE\.github\workflows\exness5setup.exe"
          if (Test-Path $exnessInstaller) {
              Write-Host "Installing Exness MT5 silently..."
              $proc = Start-Process -FilePath $exnessInstaller -ArgumentList "/auto", "/silent" -PassThru
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              while (-not $proc.HasExited -and $sw.Elapsed.TotalSeconds -lt 45) {
                  Start-Sleep -Seconds 1
              }
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          } else {
              Write-Error "Setup file 'exness5setup.exe' not found in workflows folder!"
              exit 1
          }

          # 2. Download and Install mt5tester.setup.exe (Setup 2) with Timeout Protection
          $testerInstaller = "$env:GITHUB_WORKSPACE\.github\workflows\mt5tester.setup.exe"
          if (-not (Test-Path $testerInstaller)) {
              Write-Host "Downloading mt5tester.setup.exe from repository URL..."
              $testerUrl = "https://raw.githubusercontent.com/vishnumakwana1354-collab/RDP2050/main/.github/workflows/mt5tester.setup.exe"
              try {
                  Invoke-WebRequest -Uri $testerUrl -OutFile $testerInstaller
              } catch {
                  Write-Warning "Could not download mt5tester.setup.exe via URL."
              }
          }

          if (Test-Path $testerInstaller) {
              Write-Host "Installing MetaTrader Tester silently (Setup 2)..."
              $proc = Start-Process -FilePath $testerInstaller -ArgumentList "/auto", "/silent" -PassThru
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              while (-not $proc.HasExited -and $sw.Elapsed.TotalSeconds -lt 45) {
                  Start-Sleep -Seconds 1
              }
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          } else {
              Write-Warning "mt5tester.setup.exe not found. Continuing..."
          }

      - name: Setup Config, Sync MQL5 Experts & Compile
        run: |
          # 1. MT5 Live Trading INI Config (Exness-MT5Trial7 Account & MQL5 Community Login)
          $desktopPath = "C:\Users\Public\Desktop"
          if (-not (Test-Path $desktopPath)) {
              $desktopPath = [System.IO.Path]::Combine($env:USERPROFILE, "Desktop")
          }
          $configPath = Join-Path $desktopPath "mt5_live_config.ini"

          $iniContent = @"
          [Common]
          Login=434157116
          Password=Admin&@12345
          Server=Exness-MT5Trial7
          SavePassword=1

          [Community]
          Login=rinkugohil30897
          Password=fW4JT5vz

          [Experts]
          AllowLiveTrading=1
          AllowDllImport=1
          WebRequest=1
          WebRequestUrl=https://nfs.faireconomy.media/ff_calendar_thisweek.csv,https://api.fxblue.com/market-data/tools/sentiment

          [Startup]
          Symbol=XAUUSDm
          Period=M1
          "@

          [System.IO.File]::WriteAllText($configPath, $iniContent, [System.Text.Encoding]::ASCII)

          # 2. Locate Target Terminal Path & Sync MQL5 Experts & Extract Zips & Compile
          $mt5Path = "C:\Program Files\MetaTrader 5 - EXNESS"
          $metaEditorExe = "$mt5Path\metaeditor64.exe"
          
          $targetTerminalPath = "C:\Users\Admin\AppData\Roaming\MetaQuotes\Terminal\78D61077B4C86688517531BD9FD69587"
          $terminalFolders = @($targetTerminalPath)

          $roamingPath = "$env:APPDATA\MetaQuotes\Terminal"
          if (Test-Path $roamingPath) {
              $allFolders = Get-ChildItem -Path $roamingPath -Directory | Select-Object -ExpandProperty FullName
              foreach ($f in $allFolders) {
                  if ($terminalFolders -notcontains $f) { $terminalFolders += $f }
              }
          }

          foreach ($folder in $terminalFolders) {
              $mql5Target = Join-Path $folder "MQL5"
              if (-not (Test-Path $mql5Target)) { New-Item -ItemType Directory -Path $mql5Target -Force | Out-Null }

              $excludeList = @(".git", ".github", ".claude", ".clinerules")
              Get-ChildItem -Path $env:GITHUB_WORKSPACE | Where-Object { $excludeList -notcontains $_.Name } | ForEach-Object {
                  Copy-Item -Path $_.FullName -Destination $mql5Target -Recurse -Force
              }

              $repoExpertsPath = Join-Path $env:GITHUB_WORKSPACE "MQL5\Experts"
              $expertsTarget = Join-Path $mql5Target "Experts"
              if (-not (Test-Path $expertsTarget)) { New-Item -ItemType Directory -Path $expertsTarget -Force | Out-Null }

              if (Test-Path $repoExpertsPath) {
                  Copy-Item -Path "$repoExpertsPath\*" -Destination $expertsTarget -Recurse -Force

                  $zipFiles = Get-ChildItem -Path $expertsTarget -Filter "*.zip"
                  foreach ($zip in $zipFiles) {
                      $extractFolder = Join-Path $expertsTarget $zip.BaseName
                      New-Item -ItemType Directory -Path $extractFolder -Force | Out-Null
                      Expand-Archive -Path $zip.FullName -DestinationPath $extractFolder -Force
                  }
              }

              if (Test-Path $metaEditorExe) {
                  $mq5Files = Get-ChildItem -Path $expertsTarget -Filter "*.mq5" -Recurse
                  foreach ($mq5 in $mq5Files) {
                      $proc = Start-Process -FilePath $metaEditorExe -ArgumentList "/compile:`"$($mq5.FullName)`"" -PassThru
                      $sw = [System.Diagnostics.Stopwatch]::StartNew()
                      while (-not $proc.HasExited -and $sw.Elapsed.TotalSeconds -lt 25) {
                          Start-Sleep -Milliseconds 500
                      }
                      if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
                  }
              }
          }

          # 3. Create Bulletproof run_all.bat for starting MT5, Wizard Closer, and MetaTester Agents
          $batPath = Join-Path $desktopPath "run_all.bat"
          $batContent = @"
          @echo off
          title Exness MT5 & MetaTester Agents Runner
          echo ========================================================
          echo    Starting Exness MT5 & Strategy Agents Automation
          echo ========================================================

          set "MT5_PATH=C:\Program Files\MetaTrader 5 - EXNESS"
          set "TERMINAL=%MT5_PATH%\terminal64.exe"
          set "METATESTER=%MT5_PATH%\metatester64.exe"
          set "CONFIG_FILE=%~dp0mt5_live_config.ini"

          :: 1. Stop existing instances to avoid conflicts
          taskkill /F /IM terminal64.exe 2>nul
          taskkill /F /IM metatester64.exe 2>nul
          timeout /t 3 /nobreak >nul

          if not exist "%TERMINAL%" (
              echo [ERROR] MT5 Terminal not found!
              goto END
          )

          :: 2. Launch MT5 Profile Initialization
          echo [1/4] Initializing MT5 Profile...
          start "" "%TERMINAL%"
          timeout /t 6 /nobreak >nul
          taskkill /F /IM terminal64.exe 2>nul
          timeout /t 2 /nobreak >nul

          :: 3. Start Background Job to Automatically Dismiss "Open an Account" Wizard
          echo [2/4] Starting Background Wizard Auto-Closer...
          start /min powershell -Command "$sig = '[DllImport(\"user32.dll\")] public static extern IntPtr FindWindow(string l, string w); [DllImport(\"user32.dll\")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);'; $type = Add-Type -MemberDefinition $sig -Name 'Win32W' -Namespace 'Bot' -PassThru; while($true) { $hwnd = $type::FindWindow($null, 'Open an Account'); if($hwnd -ne [IntPtr]::Zero) { $type::PostMessage($hwnd, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero); }; Start-Sleep -Seconds 1; }"

          :: 4. Launching MT5 with Live Trading Config (Exness-MT5Trial7)
          echo [3/4] Launching MetaTrader 5 with Config (XAUUSDm)...
          start "" "%TERMINAL%" "/config:%CONFIG_FILE%"
          timeout /t 6 /nobreak >nul

          :: 5. Launching MetaTester 5 Agents Manager safely
          echo [4/4] Launching MetaTester 5 Agents...
          if exist "%METATESTER%" (
              start "" "%METATESTER%"
          ) else (
              echo [INFO] MetaTester executable not found at specified path. Skipping.
          )

          echo ========================================================
          echo    Success! MT5 and Strategy Agents are running live.
          echo ========================================================
          :END
          "@

          [System.IO.File]::WriteAllText($batPath, $batContent, [System.Text.Encoding]::ASCII)
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$batPath`""

      - name: Maintain Connection & Monitor RDP
        run: |
          Write-Host ""
          Write-Host "====================================="
          Write-Host "        RDP ACCESS DETAILS           "
          Write-Host "====================================="
          Write-Host "IP Address : $env:TAILSCALE_IP"
          Write-Host "Username   : Admin"
          Write-Host "Password   : Vishnu"
          Write-Host "====================================="
          Write-Host ""

          while ($true) {
              Write-Host "[(Get-Date)] RDP Active - Server, MT5 & Strategy Agents running..."
              Start-Sleep -Seconds 300
          }
