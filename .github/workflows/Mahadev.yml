# File: .forgejo/workflows/exness-mt5.yml
# Purpose: build/deploy MQL5 files to a SELF-HOSTED Windows PC and verify MT5.
# IMPORTANT:
# - Register a dedicated Forgejo Runner on this Windows PC with label: windows:host
# - Keep this runner restricted to a trusted/private repository and trusted maintainers.
# - Install MT5 once from Exness' official download page, then add
#   "Exness Technologies Ltd" and select the exact server for your account.
# - Set the secrets listed in the README section below.
# - This workflow does NOT enable live trading automatically.
# - MQL5 Cloud Network Agent Manager must be configured interactively as described below.

name: Exness MT5 - Secure Windows Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "MQL5/**"
      - ".forgejo/workflows/exness-mt5.yml"

permissions:
  contents: read

concurrency:
  group: exness-mt5-deploy
  cancel-in-progress: false

jobs:
  deploy-mt5:
    # Runner config.yml must contain: windows:host
    runs-on: windows
    timeout-minutes: 30

    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v4

      - name: Validate Windows self-hosted runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:OS -ne "Windows_NT") {
            throw "This workflow must run on a Windows self-hosted runner."
          }
          Write-Host "Windows self-hosted runner validated."

      - name: Install official MetaTrader 5 if missing
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "C:\MT5-Exness"
          $terminal = Join-Path $installDir "terminal64.exe"

          if (Test-Path $terminal) {
            Write-Host "MT5 already installed at $installDir"
            exit 0
          }

          # Official MetaTrader 5 Windows installer linked by the MetaTrader 5
          # download page. The broker/server is selected in MT5 on first launch.
          $installer = Join-Path $env:TEMP "mt5setup.exe"
          $downloadUrl = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer -UseBasicParsing
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 1MB) {
            throw "MT5 installer download failed or returned an unexpected file."
          }

          # MetaTrader installer supports unattended installation with /auto.
          $proc = Start-Process -FilePath $installer `
            -ArgumentList "/auto" -Wait -PassThru
          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          # Installer default location varies. Do not guess if it installed elsewhere.
          $candidates = @(
            "C:\Program Files\MetaTrader 5\terminal64.exe",
            "C:\Program Files (x86)\MetaTrader 5\terminal64.exe",
            "$env:LOCALAPPDATA\Programs\MetaTrader 5\terminal64.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $found) {
            throw "MT5 installation could not be verified. Install MT5 from Exness' official page and rerun."
          }

          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $sourceDir = Split-Path $found -Parent
          if ($sourceDir -ne $installDir) {
            Copy-Item -Path (Join-Path $sourceDir "*") -Destination $installDir -Recurse -Force
          }

          if (-not (Test-Path $terminal)) {
            throw "MT5 files were not found in $installDir after installation."
          }

          Write-Host "MT5 installed and verified."

      - name: Deploy MQL5 source and compile Expert Advisors
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "C:\MT5-Exness"
          $terminal = Join-Path $installDir "terminal64.exe"
          $editor = Join-Path $installDir "metaeditor64.exe"

          if (-not (Test-Path $terminal)) {
            throw "MT5 terminal not found. Install MT5 first."
          }

          $sourceMql5 = Join-Path $env:GITHUB_WORKSPACE "MQL5"
          if (-not (Test-Path $sourceMql5)) {
            Write-Host "No MQL5 directory found; nothing to deploy."
            exit 0
          }

          # Portable mode keeps terminal data under C:\MT5-Exness\MQL5.
          $targetMql5 = Join-Path $installDir "MQL5"
          New-Item -ItemType Directory -Path $targetMql5 -Force | Out-Null

          Get-ChildItem -Path $sourceMql5 -Force | ForEach-Object {
            $destination = Join-Path $targetMql5 $_.Name
            if ($_.PSIsContainer) {
              Copy-Item -Path $_.FullName -Destination $destination -Recurse -Force
            } else {
              Copy-Item -Path $_.FullName -Destination $destination -Force
            }
          }

          if (-not (Test-Path $editor)) {
            Write-Warning "MetaEditor not found. Source was copied but compilation was skipped."
            exit 0
          }

          $expertRoot = Join-Path $targetMql5 "Experts"
          $mq5Files = Get-ChildItem -Path $expertRoot -Filter "*.mq5" -Recurse -ErrorAction SilentlyContinue

          if (-not $mq5Files) {
            Write-Host "No .mq5 Expert Advisor files found."
            exit 0
          }

          $logDir = Join-Path $env:GITHUB_WORKSPACE "build-logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          $failed = @()
          foreach ($file in $mq5Files) {
            $log = Join-Path $logDir ($file.BaseName + ".log")
            Write-Host "Compiling $($file.FullName)"

            $args = "/portable /compile:`"$($file.FullName)`" /log:`"$log`""
            $p = Start-Process -FilePath $editor -ArgumentList $args -Wait -PassThru

            if ($p.ExitCode -ne 0) {
              $failed += $file.FullName
              Write-Warning "MetaEditor returned exit code $($p.ExitCode) for $($file.Name)"
            }

            if (Test-Path $log) {
              Get-Content $log | Select-Object -Last 30
              if (Select-String -Path $log -Pattern "0 errors" -Quiet) {
                Write-Host "Compile log reports zero errors for $($file.Name)"
              } elseif (Select-String -Path $log -Pattern "[1-9][0-9]* errors" -Quiet) {
                $failed += $file.FullName
              }
            }
          }

          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error "Compilation failed: $_" }
            throw "One or more MQL5 files failed compilation. Review build-logs."
          }

      - name: Verify deployment and publish build logs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "C:\MT5-Exness"
          if (-not (Test-Path (Join-Path $installDir "terminal64.exe"))) {
            throw "MT5 terminal verification failed."
          }

          $eaCount = (Get-ChildItem (Join-Path $installDir "MQL5\Experts") -Filter "*.ex5" -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "MT5 terminal verified."
          Write-Host "Compiled EX5 files found: $eaCount"

          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE "build-logs")) {
            Write-Host "Build logs are available in build-logs."
          }

# No trading-account password is required by this compile/deploy workflow.
# Log in to MT5 manually once and let MT5 store credentials using its own
# protected account storage. Do not put broker or MQL5.community passwords
# into workflow YAML, repository files, or build logs.
#
# ONE-TIME MANUAL SETUP
# 1. Install/register Forgejo Runner on your own Windows PC; use a dedicated
#    Windows account and runner label "windows:host".
# 2. Install MT5 from https://get.exness.help/hc/en-us/articles/360011514572-MT5-Trading-guide-Desktop
#    (the workflow can install the generic official MT5 terminal, but the first
#    Exness broker/server discovery must be verified interactively).
# 3. In MT5: File > Open an Account > search "Exness" > choose
#    "Exness Technologies Ltd" > select the exact server for your account.
#    Then verify with File > Login to Trade Account.
# 4. Keep AllowLiveTrading disabled until you have manually checked the EA and
#    risk controls. Never assume a successful compile means a safe EA.
# 5. MQL5 Cloud Network: install the official MetaTrader 5 Agent Manager,
#    open Services > Add agents, then MQL5 Cloud Network tab, enable
#    "Sell computing resources through a MQL5.community account", and enter
#    your own valid MQL5.community account. Agent count must not exceed logical
#    CPU cores. Cloud participation has hardware/PR/disk restrictions; a VM
#    cannot participate. Earnings are variable and not guaranteed.
